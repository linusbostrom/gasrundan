<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poängliga – Gåsrundan 2026</title>
  <meta name="description" content="Poängliga Gåsrundan 2026.">
  <link rel="stylesheet" href="css/gasrundan.css">
  <style>
    .points-key { display: flex; flex-wrap: wrap; gap: 6px; margin: 0.25rem 0 1.5rem; }
    .points-pill { font-size: 12px; font-weight: 600; background: var(--gc-card); border: 0.5px solid var(--gc-border); border-radius: 20px; padding: 3px 10px; color: var(--gc-muted); }
    .points-pill span { color: var(--gc-text); font-weight: 700; }
    .standing-full { width: 100%; border-collapse: collapse; margin-bottom: 2rem; }
    .standing-full th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gc-muted); padding: 0.4rem 0.5rem 0.4rem 0; border-bottom: 0.5px solid var(--gc-border); }
    .standing-full th.right { text-align: right; }
    .standing-full td { padding: 0.65rem 0.5rem 0.65rem 0; border-bottom: 0.5px solid var(--gc-border); font-size: 15px; vertical-align: middle; }
    .standing-full td:first-child { color: var(--gc-muted); font-size: 13px; font-weight: 700; width: 24px; }
    .standing-full td.total { text-align: right; font-weight: 700; font-family: var(--gc-andika); font-size: 15px; color: var(--gc-orange); white-space: nowrap; }
    .updated-note { font-size: 13px; color: var(--gc-muted); font-style: italic; margin-bottom: 1.5rem; }
    .standing-note { font-size: 13px; color: var(--gc-muted); font-style: italic; padding-bottom: 2rem; }
  </style>
</head>
<body>

<header>
  <div class="topbar">
    <span class="logo"><a href="index.html" class="logo-link">Gåsrundan</a></span>
     <img src="img/gasrundan-50.svg" alt="50 år" class="jubileum-emblem-img">
  </div>
  <div class="tagline-strip">
    En serie korta löptävlingar i Arvidsjaur för hela familjen
  </div>
</header>

<div id="sub-nav-container" class="sub-nav-container"></div>
<main class="main" id="main-content">
  <p class="loading">Laddar…</p>
</main>

<footer class="site-footer">
  © 2026 Gåsrundan &nbsp;·&nbsp; Skapad av Johan Piribauer 1977 &nbsp;·&nbsp; Arrangeras av Lennart Jonsson och vänner
</footer>

<script>
function fmtPts(p) {
  return Number.isInteger(p) ? p + ' p' : p.toFixed(1) + ' p';
}

function scrollSubNavToActive() {
  const pills = document.querySelector('.sub-nav');
  const active = pills && pills.querySelector('.sub-nav-pill.active');
  if (active && pills) {
    pills.scrollLeft = active.offsetLeft - 22;
  }
}

async function init() {
  const main = document.getElementById('main-content');

  let data;
  try {
    const res = await fetch('data/2026.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (e) {
    main.innerHTML = '<p class="error-msg">Kunde inte ladda data.</p>';
    return;
  }

  // Sub-nav
  const pills = data.rundor.map(r => {
    const haRes = r.resultat && r.resultat.length > 0;
    const cls = ['sub-nav-pill', !haRes ? 'no-results' : ''].filter(Boolean).join(' ');
    return `<a class="${cls}" href="lopp.html?runda=${r.nr}">Runda ${r.nr}</a>`;
  }).join('') + `<a class="sub-nav-pill active" href="pongligan.html">Poängliga</a>`;

  const subNavHTML = `
    <nav class="sub-nav">
      <span class="sub-nav-arrow disabled">&#8249;</span>
      <div class="sub-nav-pills">${pills}</div>
      <span class="sub-nav-arrow disabled">&#8250;</span>
    </nav>`;

  const stallning = data.stallning || [];
  const doneRundor = data.rundor.filter(r => r.resultat && r.resultat.length > 0);

  if (!stallning.length || !doneRundor.length) {
document.getElementById('sub-nav-container').innerHTML = subNavHTML;
scrollSubNavToActive();
main.innerHTML = `
      <h1 class="section-head" style="padding-top:1.25rem">Poängliga</h1>
      <p class="standing-note">Inga rundor avklarade ännu — poängligan publiceras efter runda 1.</p>`;
    return;
  }

  const rows = stallning.map(p =>
    `<tr>
      <td>${p.plats}</td>
      <td>${p.namn}</td>
      <td class="total">${fmtPts(p.poang)}</td>
    </tr>`
  ).join('');

document.getElementById('sub-nav-container').innerHTML = subNavHTML;
main.innerHTML = `
      <h1 class="section-head" style="padding-top:1.25rem">Poängliga 2026</h1>
    <p> Poäng ges till de främsta i varje runda; Ettan får 12 poäng, tvåan 9 och sedan 7-5-4-3-2-1 för placering tre till åtta. Från placering nio ges 0,5 poäng för alla
som deltar.</p>
<p>Bästa kille och tjej (de med högst poäng) får var sin pokal.
Vid samma poäng går den före som har bästa enskilda resultat på någon runda.</p>
  <h3>Poängligan 2026, efter ${doneRundor.length} av 10 rundor</h3>
    <table class="standing-full">
      <tbody>${rows}</tbody>
    </table>`;
}

init();
</script>
</body>
</html>
