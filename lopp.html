<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gåsrundan 2026</title>
  <meta name="description" content="Resultat från Gåsrundan 2026.">
  <link rel="stylesheet" href="css/gasrundan.css">
</head>
<body>

<header>
<div class="topbar">
    <span class="logo"><a href="index.html" class="logo-link">Gåsrundan</a></span>
     <img src="img/gasrundan-50.svg" alt="50 år" class="jubileum-emblem-img">
  </div>
  <div class="tagline-strip">
    En serie korta löptävlingar i Arvidsjaur för hela familjen
  </div>
</header>

<div id="sub-nav-container" class="sub-nav-container"></div>
<main class="main main--wide" id="main-content">
  <p class="loading">Laddar…</p>
</main>

<footer class="site-footer">
  © 2026 Gåsrundan &nbsp;·&nbsp; Skapad av Johan Piribauer 1977 &nbsp;·&nbsp; Arrangeras av Lennart Jonsson och vänner
</footer>

<script>
function formatDate(dateStr, dag) {
  const d = new Date(dateStr + 'T12:00:00');
  const months = ['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
  return dag + ' ' + d.getDate() + ' ' + months[d.getMonth()] + ' 2026';
}

function formatPlats(plats) {
  return String(plats).padStart(2, '0') + ')';
}

function scrollSubNavToActive() {
  const pills = document.querySelector('.sub-nav');
  const active = pills && pills.querySelector('.sub-nav-pill.active');
  if (active && pills) {
    pills.scrollLeft = active.offsetLeft - 4;
  }
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  const nr = parseInt(params.get('runda'));
  const main = document.getElementById('main-content');

  if (!nr || isNaN(nr)) {
    main.innerHTML = '<p class="error-msg">Ingen runda angiven. <a href="index.html">Tillbaka</a></p>';
    return;
  }

  let data;
  try {
    const res = await fetch('data/2026.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (e) {
    main.innerHTML = '<p class="error-msg">Kunde inte ladda data.</p>';
    return;
  }

  const runda = data.rundor.find(r => r.nr === nr);
  if (!runda) {
    main.innerHTML = '<p class="error-msg">Runda ' + nr + ' hittades inte. <a href="index.html">Tillbaka</a></p>';
    return;
  }

  document.title = 'Runda ' + runda.nr + ' – Gåsrundan 2026';

  const hasResults = runda.resultat && runda.resultat.length > 0;
  const prevRunda  = data.rundor.find(r => r.nr === nr - 1);
  const nextRunda  = data.rundor.find(r => r.nr === nr + 1);

  // ── Sub-nav ──
  const pills = data.rundor.map(r => {
    const isActive = r.nr === nr;
    const haRes = r.resultat && r.resultat.length > 0;
    const cls = ['sub-nav-pill', isActive ? 'active' : '', (!haRes && !isActive) ? 'no-results' : ''].filter(Boolean).join(' ');
    return `<a class="${cls}" href="lopp.html?runda=${r.nr}">Runda ${r.nr}</a>`;
  }).join('') + `<a class="sub-nav-pill" href="pongligan.html">Poängliga</a>`;

  const prevLink = prevRunda
    ? `<a class="sub-nav-arrow" href="lopp.html?runda=${prevRunda.nr}">&#8249;</a>`
    : `<span class="sub-nav-arrow disabled">&#8249;</span>`;
  const nextLink = nextRunda
    ? `<a class="sub-nav-arrow" href="lopp.html?runda=${nextRunda.nr}">&#8250;</a>`
    : `<span class="sub-nav-arrow disabled">&#8250;</span>`;

  const subNavHTML = `
    <nav class="sub-nav">
      ${prevLink}
      <div class="sub-nav-pills">${pills}</div>
      ${nextLink}
    </nav>`;

  // ── Intro: eyebrow + rubrik (full bredd) ──
  const introHTML = `
    <div class="res-intro">
      <div class="res-eyebrow">Runda ${runda.nr} &nbsp;·&nbsp; ${formatDate(runda.datum, runda.dag)}</div>
      <h1 class="res-title">${runda.rubrik || 'Runda ' + runda.nr}</h1>
    </div>`;

  // ── Artikel ──
  const artikelHTML = runda.artikel
    ? `<div class="res-article-area">${runda.artikel.split('\n').filter(s => s.trim()).map(s => `<p class="res-article">${s}</p>`).join('')}</div>`
    : `<div class="res-article-area"></div>`;

// ── Meta ──
  const hasVader   = runda.vader;
  const hasSnodjup = runda.snodjup;
  const hasPersInfo = runda.tidtagare || runda.nummergivare;
  const metaHTML = `
    <div class="res-meta-col">
      <div class="meta-row">
        <div class="meta-box">
          <div class="meta-item"><div class="meta-label">Bana</div><div class="meta-value">${runda.stracka_meter} m</div></div>
          ${hasVader   ? `<div class="meta-item"><div class="meta-label">Väder</div><div class="meta-value">${runda.vader}</div></div>` : ''}
          ${hasSnodjup ? `<div class="meta-item"><div class="meta-label">Snödjup</div><div class="meta-value">${runda.snodjup}</div></div>` : ''}
        </div>
        ${hasPersInfo ? `
        <div class="meta-box">
          ${runda.tidtagare    ? `<div class="meta-item"><div class="meta-label">Tidtagare</div><div class="meta-value">${runda.tidtagare}</div></div>` : ''}
          ${runda.nummergivare ? `<div class="meta-item"><div class="meta-label">Nummergivare</div><div class="meta-value">${runda.nummergivare}</div></div>` : ''}
        </div>` : ''}
      </div>
    </div>`;

  // ── Resultatlista ──
  const resultsHTML = hasResults
    ? `<div class="results-title">Resultat Gåsrunda ${runda.nr}, 2026</div>
       ${runda.resultat.map(p => `
         <div class="result-row">
           <span class="res-nr">${formatPlats(p.plats)}</span>
           <span class="res-name">${p.namn}</span>
           <span class="res-tid">${p.tid}</span>
         </div>`).join('')}`
    : `<p class="standing-note">Resultaten är inte publicerade ännu — kom tillbaka senare!</p>`;

  document.getElementById('sub-nav-container').innerHTML = subNavHTML;
  scrollSubNavToActive();
main.innerHTML = introHTML + `
    <div class="res-desktop-wrap">
      ${artikelHTML}
      ${metaHTML}
      <div class="res-results-area">${resultsHTML}</div>
    </div>`;
}

init();
</script>
</body>
</html>
